# =============================================================================
# Terafort <- Amazon Appstore Reporting API -> BigQuery          (v1.0)
# Path MUST be: .github/workflows/terafort_amazon.yml
#
# AUTH DESIGN — PERMANENT (Apero se seekha hua sabaq):
#   LWA client_credentials (CLIENT_ID + SECRET -> fresh 1h token every run).
#   NO refresh-token chain, NO persist step, NO GH_PAT, NO canary, NO manual
#   re-seed — EVER. Credentials live until the security profile is deleted.
#   (Amazon recommends refreshing the security profile every ~6 months —
#    set a calendar reminder; that is the ONLY maintenance.)
#
# Reports pulled (everything the API offers):
#   sales / earnings / subscription / subscriptions_overview
#   -> BigQuery dataset amazon_appstore:
#      sales_raw / earnings_raw / subscription_raw / subs_overview_raw
#
# Idempotent: each monthly file DELETE+load by report_month — safe to re-run.
# Restatement-safe: daily mode re-pulls current + previous month (Amazon
# updates monthly files every 24h, lag up to 48h, adjustments land in the
# month they are made).
#
# FIRST RUN: manual dispatch with mode=backfill (backfill_start=2018-01)
#            to pull the full history. After that the crons keep it fresh.
#
# Required repo secrets: AMAZON_CLIENT_ID, AMAZON_CLIENT_SECRET,
#                        GCP_SA_KEY, BQ_PROJECT
# =============================================================================
name: terafort_amazon_to_bigquery

on:
  schedule:
    - cron: "45 2 * * *"        # 02:45 UTC = 07:45 PKT daily
    - cron: "45 14 * * *"       # 14:45 UTC = 19:45 PKT daily (safety run)
  workflow_dispatch:
    inputs:
      mode:
        description: "daily (curr+prev month) | backfill (full history)"
        required: false
        default: "daily"
        type: choice
        options: [daily, backfill]
      backfill_start:
        description: "Backfill start YYYY-MM (earliest: 2018-01)"
        required: false
        default: "2018-01"
        type: string

permissions:
  contents: read

concurrency:
  group: amazon-pull            # backfill + cron kabhi ek saath na chalein
  cancel-in-progress: false

jobs:
  pull-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 120        # full 2018+ backfill needs headroom

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Amazon Appstore -> BigQuery pipeline
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
          BQ_DATASET: amazon_appstore
          MODE: ${{ inputs.mode || 'daily' }}
          BACKFILL_START: ${{ inputs.backfill_start || '2018-01' }}
        run: python terafort_amazon.py

      - name: Verify load (rows per table per month, latest 6)
        env:
          BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
        run: |
          python - <<'EOF'
          import os
          from google.cloud import bigquery
          bq = bigquery.Client(project=os.environ["BQ_PROJECT"])
          for t in ["sales_raw", "earnings_raw",
                    "subscription_raw", "subs_overview_raw"]:
              try:
                  q = f"""SELECT report_month, COUNT(*) rows
                          FROM `{os.environ["BQ_PROJECT"]}.amazon_appstore.{t}`
                          GROUP BY report_month
                          ORDER BY report_month DESC LIMIT 6"""
                  print(f"── {t} " + "─" * 30)
                  for r in bq.query(q).result():
                      print(f"   {r.report_month}  {r.rows:>9,} rows")
              except Exception as e:
                  print(f"── {t}: (no table yet / {type(e).__name__})")
          EOF
