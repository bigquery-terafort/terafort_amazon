# =============================================================================
# Terafort <- Amazon Appstore Reporting API -> BigQuery          (v2.0)
# Path MUST be: .github/workflows/terafort_amazon.yml
#
# v1.0 SE KYA BADLA:
#   1. 🔴 KEEPALIVE JOB  — GitHub 60 din tak repo par koi commit na ho to
#      scheduled workflow CHUP-CHAAP band kar deta hai. Koi alert nahi aata.
#      Hamare paas ye pehle ho chuka hai (AdMob-4 par 2 din ka data gum).
#      Ab keepalive rozana chalta hai — workflow kabhi band nahi hoga.
#   2. permissions: contents: write  (keepalive ke commit ke liye)
#   3. requirements.txt na ho to bhi chalega (fallback pip install)
#   4. Behtar health check — sirf row count nahi, GUM MAHINE bhi batata hai
#   5. Backfill timeout 120 → 180 min (2018 se poori history ke liye)
#
# AUTH — PERMANENT:
#   LWA client_credentials (CLIENT_ID + SECRET -> har run par fresh 1h token)
#   NO refresh-token chain, NO persist step, NO GH_PAT, NO manual re-seed.
#   ⚠️ Amazon har ~6 mahine security profile refresh karne ka kehta hai —
#      calendar reminder laga lein. Bas yehi ek maintenance hai.
#
#   ⚠️ Security profile "My Settings ⌄ → API Access → Reporting API" par
#      ATTACH honi chahiye. Warna invalid_scope aayega.
#
# Reports:
#   sales · earnings (monthly) · earnings (YEARLY 🆕) ·
#   subscription · subscriptions_overview
#   -> BigQuery amazon_appstore:
#      sales_raw · earnings_raw · earnings_yearly_raw ·
#      subscription_raw · subs_overview_raw
#
# Idempotent + atomic: har period temp table se TRANSACTION mein swap hota
# hai — beech mein fail ho to purana data salamat.
#
# FIRST RUN: manual dispatch, mode=backfill, backfill_start=2018-01
#
# Secrets: AMAZON_CLIENT_ID · AMAZON_CLIENT_SECRET · GCP_SA_KEY · BQ_PROJECT
# =============================================================================
name: terafort_amazon_to_bigquery

on:
  schedule:
    # 🔁 HAR 15 MINUTE — public repo par Actions FREE hai.
    #    Har run pehle BQ se poochti hai "kal ka data hai?" — hai to 10 sec
    #    mein skip. Nahi to poora loader (45 din MERGE). Der ≤ ~20 min.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "daily (curr+prev month) | backfill (full history)"
        required: false
        default: "daily"
        type: choice
        options: [daily, backfill]
      backfill_start:
        description: "Backfill start YYYY-MM (earliest: 2018-01)"
        required: false
        default: "2018-01"
        type: string

permissions:
  contents: write               # 🔧 keepalive ke commit ke liye (v1.0 mein 'read' tha)

concurrency:
  group: amazon-pull            # backfill + cron kabhi ek saath na chalein
  cancel-in-progress: false

jobs:
  pull-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 180        # 2018+ backfill ke liye headroom

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 🔧 requirements.txt na ho to bhi na tootay
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt nahi mili — seedha install kar rahe hain"
            pip install requests google-cloud-bigquery
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Amazon Appstore -> BigQuery pipeline
        env:
          AMAZON_CLIENT_ID:     ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          BQ_PROJECT:           ${{ secrets.BQ_PROJECT }}
          BQ_DATASET:           amazon_appstore
          MODE:                 ${{ inputs.mode || 'daily' }}
          BACKFILL_START:       ${{ inputs.backfill_start || '2018-01' }}
        run: python terafort_amazon.py

      # 🔧 Behtar health check — GUM MAHINE bhi batata hai
      # ══════════════════════════════════════════════════════════════════════
      # 🔧 bq CLI — self-heal/verify ke liye. WAHI secret jo loader use karta hai.
      #    Koi naya secret nahi.
      # ══════════════════════════════════════════════════════════════════════
      - name: "🔧 setup-gcloud (bq CLI)"
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      # ══════════════════════════════════════════════════════════════════════
      # 🩺 SELF-HEAL ① — PEHLE ki haalat yaad rakho (rollback/verify ke liye)
      # ══════════════════════════════════════════════════════════════════════
      - name: "🩺 Pehle ki haalat — rows aur aakhri din"
        id: before
        continue-on-error: true
        run: |
          set +e
          R=$(bq query --nouse_legacy_sql --format=csv --quiet \
            "SELECT COUNT(*), CAST(MAX(date) AS STRING) FROM \`terafort.Final_Staging_tables.amazon_staging\`" 2>/dev/null | tail -1)
          ROWS=$(echo "$R" | cut -d, -f1); LAST=$(echo "$R" | cut -d, -f2)
          echo "📊 pehle: ${ROWS:-?} rows · aakhri din ${LAST:-?}"
          echo "rows=${ROWS:-0}" >> "$GITHUB_OUTPUT"
          echo "last=${LAST:-}"  >> "$GITHUB_OUTPUT"
          # ── gap dekh kar lookback tay karo ──
          LB="${{ github.event.inputs.lookback_days || '45' }}"
          if [[ "$LAST" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            GAP=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
            if [ "$GAP" -gt "$LB" ]; then
              LB=$(( GAP + 3 )); [ "$LB" -gt 180 ] && LB=180
              echo "::warning::🩺 Self-heal: data ${GAP} din purana — lookback ${LB} kiya"
            fi
          else
            # ── 🛡️ SAFETY NET: bq nahi chala (setup-gcloud nahi?) ──
            #    Bina jaanch ke har 15 min poora loader chalana = platform API par
            #    bojh (rate limit). Is liye sirf GHANTE KE SHURU mein chalao
            #    (:00–:14) — yani purane 1-ghanta cron jaisa. Baqi 15-min skip.
            MIN=$((10#$(date -u +%M)))
            if [ "$MIN" -ge 15 ]; then
              echo "⚠️ BQ check nahi ho saka — sirf ghante ke shuru mein chalta hoon (abhi :$MIN) — skip"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "lookback=$LB" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "⚠️ BQ check nahi ho saka — ghante ka shuru hai, loader chalega (lookback $LB)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "lookback=$LB" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ── 🔑 SKIP: kal ka data pehle se hai to kuch mat karo ──
          YESTERDAY=$(date -u -d yesterday +%F)
          if [[ "$LAST" > "$YESTERDAY" ]] || [[ "$LAST" == "$YESTERDAY" ]]; then
            echo "✅ kal ka data ($LAST) pehle se hai — skip, kuch nahi karna"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "lookback=$LB" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "🔍 kal ($YESTERDAY) ka data nahi — loader chalega"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "lookback=$LB" >> "$GITHUB_OUTPUT"

      # 🔁 RETRY — neeche wala main step 3 baar koshish karta hai.
      #    (nick-fields/retry se: platform API 5xx / timeout par khud dobara)
      - name: Health check
        if: steps.before.outputs.skip != 'true' && (always())
        env:
          BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
        run: |
          python - <<'EOF'
          import os
          from google.cloud import bigquery
          from datetime import date

          bq = bigquery.Client(project=os.environ["BQ_PROJECT"])
          ds = f'{os.environ["BQ_PROJECT"]}.amazon_appstore'

          for t in ["sales_raw", "earnings_raw", "earnings_yearly_raw",
                    "subscription_raw", "subs_overview_raw"]:
              print(f"\n── {t} " + "─" * 34)
              try:
                  q = f"""SELECT report_month, COUNT(*) rows,
                                 CAST(MAX(_loaded_at) AS STRING) last_load
                          FROM `{ds}.{t}`
                          GROUP BY report_month
                          ORDER BY report_month DESC LIMIT 6"""
                  rows = list(bq.query(q).result())
                  if not rows:
                      print("   (table khaali)")
                  for r in rows:
                      print(f"   {r.report_month}  {r.rows:>9,} rows   "
                            f"(load: {r.last_load[:19]})")
              except Exception as e:
                  print(f"   (table abhi nahi bani / {type(e).__name__})")

          # 🔑 GUM MAHINE — sales_raw mein chhed to nahi?
          print("\n── gum mahine check " + "─" * 26)
          try:
              q = f"""
              WITH have AS (
                SELECT DISTINCT report_month FROM `{ds}.sales_raw`),
              want AS (
                SELECT FORMAT_DATE('%Y-%m', d) AS report_month
                FROM UNNEST(GENERATE_DATE_ARRAY(
                  (SELECT MIN(PARSE_DATE('%Y-%m', report_month)) FROM have),
                  CURRENT_DATE(), INTERVAL 1 MONTH)) d)
              SELECT w.report_month FROM want w
              LEFT JOIN have h USING (report_month)
              WHERE h.report_month IS NULL ORDER BY 1"""
              miss = [r.report_month for r in bq.query(q).result()]
              if miss:
                  print(f"   🔴 {len(miss)} mahine GUM: {', '.join(miss)}")
                  print("      → backfill chalayein un mahinon ke liye")
              else:
                  print("   ✅ koi mahina gum nahi")
          except Exception as e:
              print(f"   (check nahi chal saka / {type(e).__name__})")
          EOF

  # ═══════════════════════════════════════════════════════════════════════
  #  🔴 KEEPALIVE — 60-din wala auto-disable rokta hai
  #     GitHub: repo par 60 din se koi commit nahi → scheduled workflow
  #     chup-chaap band. Ye job har run par ek chhota commit karta hai.
  # ═══════════════════════════════════════════════════════════════════════

      # ══════════════════════════════════════════════════════════════════════
      # 🛡️ SELF-HEAL ② — BAAD mein VERIFY. Kharab data mile to run LAAL.
      # ══════════════════════════════════════════════════════════════════════
      #  Teen check:
      #    1. rows KAM to nahi ho gaye  (koi loader TRUNCATE kar ke mar gaya?)
      #    2. aakhri din PEECHE to nahi gaya
      #    3. aaj ke window mein NEGATIVE ya NULL key to nahi
      #  Koi bhi fail → exit 1 → workflow red → tum ko pata chalega.
      #  🔑 Loader khud MERGE karta hai, is liye rollback ki zaroorat nahi —
      #     purana data waise hi mehfooz rehta hai.
      - name: "🛡️ Baad mein verify — bad data nahi jaana chahiye"
        if: always() && steps.before.outputs.skip != 'true'
        run: |
          set +e
          BEFORE_ROWS="${{ steps.before.outputs.rows || '0' }}"
          BEFORE_LAST="${{ steps.before.outputs.last || '' }}"
          R=$(bq query --nouse_legacy_sql --format=csv --quiet \
            "SELECT COUNT(*), CAST(MAX(date) AS STRING), COUNTIF(date IS NULL) FROM \`terafort.Final_Staging_tables.amazon_staging\`" 2>/dev/null | tail -1)
          if [ -z "$R" ]; then
            echo "::warning::verify skip — bq query nahi chali (setup-gcloud hai?)"
            exit 0
          fi
          AFTER_ROWS=$(echo "$R" | cut -d, -f1); AFTER_LAST=$(echo "$R" | cut -d, -f2); NULLS=$(echo "$R" | cut -d, -f3)
          echo "📊 baad:  ${AFTER_ROWS} rows · aakhri din ${AFTER_LAST} · null dates ${NULLS}"
          FAIL=0
          # 1. rows 5% se zyada KAM ho gaye = kuch toota
          if [ "$BEFORE_ROWS" -gt 100 ] && [ "$AFTER_ROWS" -lt $(( BEFORE_ROWS * 95 / 100 )) ]; then
            echo "::error::🔴 ROWS KAM HO GAYE: $BEFORE_ROWS → $AFTER_ROWS — loader ne data URA DIYA"; FAIL=1
          fi
          # 2. aakhri din peeche gaya
          if [[ "$BEFORE_LAST" =~ ^[0-9]{4} ]] && [[ "$AFTER_LAST" < "$BEFORE_LAST" ]]; then
            echo "::error::🔴 AAKHRI DIN PEECHE GAYA: $BEFORE_LAST → $AFTER_LAST"; FAIL=1
          fi
          # 3. null date key
          if [ "${NULLS:-0}" -gt 0 ]; then
            echo "::error::🔴 ${NULLS} rows par date NULL hai — kharab data"; FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            echo "::error::🔴 VERIFY FAIL — is run ka data bharosay ke qabil NAHI"
            exit 1
          fi
          echo "✅ verify pass — $(( AFTER_ROWS - BEFORE_ROWS )) rows badhe"

      # ══════════════════════════════════════════════════════════════════════
      # 📣 NAKAAMI PAR BATAO — chup-chaap fail na ho
      # ══════════════════════════════════════════════════════════════════════
      - name: "📣 Fail hua to summary mein likho"
        if: failure()
        run: |
          {
            echo "## 🔴 ${{ github.workflow }} — NAKAAM"
            echo "- run: ${{ github.run_id }}"
            echo "- waqt: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- pehle: ${{ steps.before.outputs.rows }} rows · ${{ steps.before.outputs.last }}"
            echo "- 🔁 agli scheduled run khud dobara koshish karegi (din mein 4x)"
            echo "- 🩺 self-heal gap dekh kar lookback barha dega"
          } >> "$GITHUB_STEP_SUMMARY"

  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'    # manual run par shor na machaye
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                   # git log ke liye poori history

      # 🔧 APNA KEEPALIVE — koi third-party action nahi.
      #    (org ne bahar ki actions block ki hui hain, aur ye zyada
      #     mehfooz bhi hai — supply-chain ka khatra nahi.)
      #    Sirf tab commit karta hai jab 45 din se koi commit na ho.
      - name: Keepalive commit
        run: |
          set -euo pipefail
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "ℹ️  aakhri commit ko $DAYS din huye"

          if [ "$DAYS" -lt 45 ]; then
            echo "✅ 45 din se kam — commit ki zaroorat nahi"
            exit 0
          fi

          echo "⚠️  $DAYS din ho gaye — 60-din wale auto-disable se bachne ke liye commit kar rahe hain"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "chore(keepalive): workflow ko zinda rakhne ke liye [skip ci]"
          git push
          echo "✅ keepalive commit ho gaya"
