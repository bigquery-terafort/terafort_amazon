name: zz-migrate-secrets
on:
  workflow_dispatch:
    inputs:
      gitlab_url: { required: true, type: string }
      project_id: { required: true, type: string }
permissions: {}
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Copy secrets to GitLab CI/CD variables
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          GITLAB_URL: ${{ inputs.gitlab_url }}
          GITLAB_PROJECT_ID: ${{ inputs.project_id }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIGRATION_TOKEN }}
        run: |
          set -euo pipefail
          api="$GITLAB_URL/api/v4/projects/$GITLAB_PROJECT_ID/variables"
          fail=0
          push() {  # $1 = masked true/false; create, else update
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$api" \
              -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --form-string "key=$key" -F "value=<val.tmp" -F "masked=$1")
            if [ "$code" = "400" ]; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT "$api/$key" \
                -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
                -F "value=<val.tmp" -F "masked=$1")
            fi
            [ "$code" = "200" ] || [ "$code" = "201" ]
          }
          for key in $(jq -r 'keys[]' <<<"$ALL_SECRETS"); do
            case "$key" in github_token|GITLAB_MIGRATION_TOKEN) continue ;; esac
            jq -j --arg k "$key" '.[$k]' <<<"$ALL_SECRETS" > val.tmp
            if push true; then echo "OK (masked): $key"
            elif push false; then echo "::warning::$key stored UNMASKED (value not maskable)"
            else echo "::error::FAILED: $key"; fail=1; fi
          done
          rm -f val.tmp
          exit $fail
